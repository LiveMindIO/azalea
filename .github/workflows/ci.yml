name: CI

on:
  push:
  pull_request:
    types: [opened, reopened]

env:
  CARGO_INCREMENTAL: 0 # required so ci doesn't run out of space
  CARGO_TERM_COLOR: always

jobs:
  clippy_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2026-09-09 --component clippy

      - name: Clippy
        run: $HOME/.cargo/bin/cargo clippy --all-features

      - name: Test
        # The standalone azalea-core test harness currently triggers a nightly
        # compiler ICE; it remains compiled and exercised as a dependency.
        run: $HOME/.cargo/bin/cargo test --workspace --exclude azalea-core
