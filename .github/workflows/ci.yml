name: CI

on:
  push:
  pull_request:
    types: [opened, reopened]

env:
  CARGO_INCREMENTAL: 0 # required so ci doesn't run out of space
  CARGO_TERM_COLOR: always

jobs:
  clippy_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly
        run: rustup update nightly && rustup default nightly && rustup component add clippy

      - name: Clippy
        run: cargo clippy --all-features

      - name: Test
        # The standalone azalea-core test harness currently triggers a nightly
        # compiler ICE; it remains compiled and exercised as a dependency.
        run: cargo test --workspace --exclude azalea-core
